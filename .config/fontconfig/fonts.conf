<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- CJK fallback: make Chinese render with Noto CJK instead of Latin-only fonts. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <accept><family>Noto Sans CJK SC</family></accept>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <accept><family>Noto Serif CJK SC</family></accept>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <accept><family>Noto Sans Mono CJK SC</family></accept>
  </alias>

  <!-- Prefer the Simplified Chinese variants explicitly for zh text. -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh-cn</string>
    </test>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh-cn</string>
    </test>
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Normal NL NF CN</string>
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>
</fontconfig>
